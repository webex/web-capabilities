name: pull-request-checks
on: [pull_request]
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: yarn install
      - run: yarn test:lint
      - run: yarn test:prettier
      - run: yarn test:spelling
      - run: yarn transpile:validate
      - run: yarn build
      - run: yarn test:coverage
